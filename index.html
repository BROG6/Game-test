<!DOCTYPE html>
<html>
<head>
    <title>Neon Dodge: Tilt</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        canvas { display: block; }
        #ui { 
            position: absolute; top: 20px; left: 20px; color: #ffd700; 
            font-size: 28px; pointer-events: none; text-shadow: 0 0 15px #ffd700; font-weight: bold;
        }
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10;
        }
        button {
            padding: 20px 40px; font-size: 24px; background: #ffd700; color: #000;
            border: none; border-radius: 50px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 20px #ffd700;
        }
        p { color: #ffd700; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="start-screen">
        <button onclick="startGame()">START GAME</button>
        <p>Tilt phone left/right to move</p>
    </div>
    <div id="ui">Score: 0</div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const ui = document.getElementById('ui');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0;
    let gameActive = false;
    let speedMult = 1;
    let timeDilation = 1;
    let shieldActive = false;
    let shieldTimer = 0;
    
    // Tilt Sensitivity
    let tiltX = 0;
    const sensitivity = 1.5; 

    const player = {
        x: canvas.width / 2,
        y: canvas.height - 120,
        radius: 18,
        color: '#ffd700'
    };

    const obstacles = [];
    const powerups = [];

    // --- SENSOR PERMISSION & START ---
    function startGame() {
        // Request iOS motion permission if needed
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission()
                .then(response => {
                    if (response == 'granted') window.addEventListener('deviceorientation', handleTilt);
                })
                .catch(console.error);
        } else {
            window.addEventListener('deviceorientation', handleTilt);
        }

        document.getElementById('start-screen').style.display = 'none';
        gameActive = true;
        draw();
    }

    function handleTilt(e) {
        // 'gamma' is the left-to-right tilt in degrees (-90 to 90)
        tiltX = e.gamma; 
    }

    function spawnObstacle() {
        const width = Math.random() * (canvas.width * 0.4) + 60;
        obstacles.push({
            x: Math.random() * (canvas.width - width),
            y: -50, w: width, h: 15
        });
    }

    function spawnPowerup() {
        const type = Math.random() > 0.5 ? 'shield' : 'slowmo';
        powerups.push({
            x: Math.random() * (canvas.width - 20),
            y: -50, radius: 12, type: type,
            color: type === 'shield' ? '#00d4ff' : '#00ff66'
        });
    }

    function update() {
        if (!gameActive) return;

        // Apply Tilt Movement
        player.x += (tiltX * sensitivity);

        // Keep player in bounds
        if (player.x < player.radius) player.x = player.radius;
        if (player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;

        if (Math.random() < 0.04) spawnObstacle();
        if (Math.random() < 0.005) spawnPowerup();

        if (timeDilation < 1) timeDilation += 0.002; 
        if (shieldTimer > 0) shieldTimer--; else shieldActive = false;

        // Obstacles
        obstacles.forEach((obs, index) => {
            obs.y += (6 * speedMult * timeDilation);
            if (!shieldActive && 
                player.x + player.radius > obs.x && player.x - player.radius < obs.x + obs.w &&
                player.y + player.radius > obs.y && player.y - player.radius < obs.y + obs.h) {
                gameActive = false;
                alert("CRASH! Score: " + score);
                location.reload();
            }
            if (obs.y > canvas.height) {
                obstacles.splice(index, 1);
                score++;
                speedMult += 0.005;
                ui.innerHTML = `Score: ${score}`;
            }
        });

        // Powerups
        powerups.forEach((p, index) => {
            p.y += (4 * timeDilation);
            if (Math.hypot(player.x - p.x, player.y - p.y) < player.radius + p.radius) {
                if (p.type === 'shield') { shieldActive = true; shieldTimer = 300; }
                else { timeDilation = 0.3; }
                powerups.splice(index, 1);
            }
        });
    }

    function draw() {
        ctx.fillStyle = 'rgba(10, 10, 10, 0.4)'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Player
        ctx.shadowBlur = 20;
        ctx.shadowColor = shieldActive ? '#00d4ff' : '#ffd700';
        ctx.fillStyle = shieldActive ? '#00d4ff' : '#ffd700';
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fill();

        // Obstacles
        ctx.shadowBlur = 0;
        obstacles.forEach(obs => {
            ctx.fillStyle = '#222';
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            ctx.strokeStyle = '#ffd700';
            ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
        });

        // Powerups
        powerups.forEach(p => {
            ctx.shadowBlur = 15;
            ctx.shadowColor = p.color;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
        });

        if (gameActive) requestAnimationFrame(draw);
        update();
    }
</script>
</body>
</html>
